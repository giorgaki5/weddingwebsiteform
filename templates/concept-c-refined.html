<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPLACE — Partner One &amp; Partner Two</title>
<meta name="description" content="REPLACE with a one-line description of the couple and the date.">
<!-- The head is NOT driven by site-data.js. Set these by hand per client:
     title, description, canonical, theme-color, favicon, and the og:/
     twitter: tags. og:image must be an absolute URL on the client domain. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   CONCEPT C — "MARQUEE"

   No cards, no containers, no motif. The page runs edge to edge and
   the only structure is scale: enormous type, hairline rules, and a
   great deal of empty space. Where A holds everything inside a small
   piece of stationery and B builds a magazine grid, this one uses the
   whole width of the screen and lets the words carry the occasion.

   PALETTE — derived arithmetically from the three supplied colours.
   base #FDFFF8 · ink #000000 · gold #D19D01
   =================================================================== */
:root{
  --base:#FDFFF8;                 /* supplied, untouched      */
  --ink:#000000;                  /* supplied, untouched      */
  --gold:#D19D01;                 /* supplied, untouched      */
  --tint:#FBFBED;                 /* gold  4.5% into base     */
  --panel:#F8F5DE;                /* gold 10.5% into base     */
  --edge:#F4EBC7;                 /* gold   20% into base     */
  --hair:#E7E9E3;                 /* ink   8.5% into base     */
  --rule:#D2D4CE;                 /* ink    17% into base     */
  --muted:#656663;                /* ink    60% into base     */
  --gold-dim:#EBD690;             /* gold   42% into base     */

  --display:"Bodoni Moda",Didot,Georgia,serif;
  --body:"Cardo",Georgia,serif;
  --pad:clamp(1.25rem,5vw,5rem);
  --ease:cubic-bezier(.16,.84,.44,1);

  --dock-bg:rgba(253,255,248,.86);
  --dock-rule:var(--rule);
  --dock-ink:var(--ink);
  --dock-muted:var(--muted);
  --dock-accent:var(--gold);
  --dock-active-bg:var(--ink);
  --dock-active-ink:var(--base);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;padding-bottom:5rem;background:var(--base);color:var(--ink);
  font-family:var(--body);font-size:1.125rem;line-height:1.72;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.skip{position:absolute;left:-9999px;background:var(--ink);color:var(--base);padding:.75rem 1rem;z-index:120}
.skip:focus{left:0;top:0}

/* ---------- motion ---------- */
[data-reveal]{opacity:0;transform:translateY(24px);
  transition:opacity 1s var(--ease),transform 1s var(--ease);
  transition-delay:calc(var(--i,0) * 110ms)}
[data-reveal].is-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  [data-reveal]{opacity:1!important;transform:none!important;transition:none!important}
  *{animation:none!important}
}
.progress{position:fixed;top:0;left:0;height:2px;width:100%;z-index:110;background:var(--gold);
  transform:scaleX(0);transform-origin:0 50%;transition:transform .12s linear}

/* ---------- photography as background layers ---------- */
.scene{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.scene__img{position:absolute;inset:-12%;transition:opacity 1.3s var(--ease);background-size:cover;background-position:center;
  filter:saturate(.92) contrast(1.02);will-change:transform;transform:scale(1.05)}
.scene__veil{position:absolute;inset:0}
.footer .scene__img{inset:-6%}
.scene-host{position:relative;isolation:isolate}
.scene-host > *:not(.scene){position:relative;z-index:1}
.hero .scene__veil{background:linear-gradient(to right,rgba(253,255,248,.58) 0%,rgba(253,255,248,.38) 55%,rgba(253,255,248,.54) 100%)}
.hero .scene--empty .scene__veil{background:none}
#story .scene__veil,#day .scene__veil{background:linear-gradient(to bottom,var(--base) 0%,rgba(253,255,248,.6) 22%,rgba(253,255,248,.6) 78%,var(--base) 100%)}
#story .scene--empty .scene__veil,#day .scene--empty .scene__veil{background:none}
.footer .scene__veil{background:linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,.72))}
.footer .scene--empty .scene__veil{background:var(--ink)}

/* ===================================================================
   HERO — the names at full width, nothing else competing
   =================================================================== */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;
  padding:clamp(5rem,11vh,8rem) var(--pad) clamp(1.75rem,4vw,2.5rem)}
.hero__place{font-family:var(--body);font-size:.6875rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--muted);margin:0;
  opacity:0;transition:opacity .9s .25s}
.is-loaded .hero__place{opacity:1}
.hero h1{margin:auto 0;font-family:var(--display);font-weight:400;
  font-size:clamp(3.25rem,15.5vw,13rem);line-height:.88;letter-spacing:-.035em}
.hero h1 span{display:block;overflow:hidden;padding-bottom:.04em}
.hero h1 i{display:block;font-style:normal;transform:translateY(108%);
  transition:transform 1.15s var(--ease)}
.is-loaded .hero h1 i{transform:none}
.is-loaded .hero h1 span:nth-child(1) i{transition-delay:.3s}
.is-loaded .hero h1 span:nth-child(2) i{transition-delay:.42s}
.is-loaded .hero h1 span:nth-child(3) i{transition-delay:.54s}
.hero h1 em{font-style:italic;color:var(--gold);font-size:.4em;
  letter-spacing:-.01em;display:block;line-height:1.5;padding-left:.06em}

.hero__foot{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;
  align-items:baseline;gap:.6rem 2.5rem;padding-top:1.35rem;
  opacity:0;transform:translateY(14px);transition:opacity .9s .95s,transform .9s .95s}
.is-loaded .hero__foot{opacity:1;transform:none}
.hero__foot::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:var(--ink);transform:scaleX(0);transform-origin:0 50%;
  transition:transform 1.4s var(--ease) .8s}
.is-loaded .hero__foot::before{transform:none}
.hero__foot p{margin:0;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase}
.hero__foot .dim{color:var(--muted)}

/* ===================================================================
   BANDS — every section runs the full width, divided by one rule
   =================================================================== */
.band{padding:clamp(4rem,9vw,7rem) var(--pad) clamp(4.5rem,10vw,8rem);
  border-top:1px solid var(--ink);position:relative}
.band__head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
  gap:.75rem 2rem;margin-bottom:clamp(2.5rem,6vw,4rem)}
.band__head h2{margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(2rem,7.5vw,5rem);line-height:.95;letter-spacing:-.025em}
.band__head p{margin:0;font-size:.6875rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold)}

/* ---------- story: a ledger of ten years ---------- */
.years{list-style:none;margin:0;padding:0}
.year{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr);
  gap:.5rem clamp(1.5rem,5vw,4rem);align-items:start;
  border-top:1px solid var(--hair);padding-block:clamp(2rem,5vw,3.25rem);
  transition:opacity .7s var(--ease)}
.year:last-child{border-bottom:1px solid var(--hair)}
.is-focusable .year{opacity:.32}
.is-focusable .year.is-focus{opacity:1}
.year__when{margin:0;font-family:var(--display);font-size:clamp(1rem,2.2vw,1.25rem);
  line-height:1.3;color:var(--gold);font-style:italic}
.year__where{display:block;font-family:var(--body);font-style:normal;font-size:.6875rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:.55rem}
.year__body h3{margin:0 0 .7rem;font-family:var(--display);font-weight:400;
  font-size:clamp(1.5rem,3.6vw,2.125rem);line-height:1.15;letter-spacing:-.01em}
.year__body p{margin:0;max-width:44rem;font-size:clamp(1.0625rem,1.4vw,1.1875rem);line-height:1.78}
@media (max-width:720px){
  .year{grid-template-columns:1fr;gap:.35rem}
  .year__when{font-size:.9375rem}
  .year__where{display:inline;margin:0 0 0 .6rem}
}

.traits{display:flex;flex-wrap:wrap;gap:1.25rem clamp(2.5rem,7vw,6rem);
  margin:clamp(2.5rem,6vw,3.5rem) 0 0;padding-top:1.75rem;border-top:1px solid var(--ink)}
.traits div{max-width:20rem}
.traits dt{font-family:var(--display);font-style:italic;color:var(--gold);font-size:1.375rem}
.traits dd{margin:.2rem 0 0;font-size:1rem;color:var(--muted)}

/* ---------- the day: three full-width rows, the hour set enormous ---------- */
.slots{margin:0;padding:0;list-style:none}
.slot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);
  gap:1rem clamp(1.5rem,5vw,4rem);align-items:start;
  border-top:1px solid var(--ink);padding-block:clamp(2.25rem,5vw,3.5rem)}
.slot:last-child{border-bottom:1px solid var(--ink)}
.slot__hour{margin:0 0 1.25rem;font-family:var(--display);font-weight:400;
  font-size:clamp(3.25rem,11vw,7.5rem);line-height:.84;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;transition:color .5s var(--ease)}
.slot:hover .slot__hour{color:var(--gold)}
.slot__mer{margin:.7rem 0 0;font-size:.6875rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted)}
.slot__body h3{margin:0 0 .85rem;font-family:var(--display);font-weight:400;
  font-size:clamp(1.5rem,3.4vw,2rem);line-height:1.15;letter-spacing:-.01em}
.slot__when{margin:0 0 1.35rem;font-style:italic;color:var(--muted);font-size:1.0625rem}
.slot__venue{margin:0 0 .1rem;font-size:1.0625rem}
.slot__addr{margin:0 0 1.25rem;font-size:.9375rem}
.slot__addr a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule);
  transition:color .3s,border-color .3s}
.slot__addr a:hover{color:var(--gold);border-bottom-color:var(--gold)}
.slot__about{margin:0;max-width:40rem}
.slot__note{margin:1.25rem 0 0;font-size:.9375rem;color:var(--muted);
  padding-left:1rem;border-left:1px solid var(--gold);max-width:36rem}
/* the Stefana — a footnote inside the ceremony, never a headline */
.aside{margin:1.5rem 0 0;padding-top:1.2rem;border-top:1px solid var(--hair);max-width:40rem}
.aside h4{margin:0 0 .5rem;font-size:.625rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold);font-weight:400;font-family:var(--body)}
.aside p{margin:0;font-size:.9375rem;line-height:1.75;color:var(--muted)}
@media (max-width:720px){
  .slot{grid-template-columns:1fr;gap:.25rem}
  }

.dayfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;
  gap:1.5rem 3rem;margin-top:clamp(2.5rem,6vw,3.5rem)}
.countdown{margin:0;font-size:.6875rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.countdown b{display:block;font-family:var(--display);font-weight:400;
  font-size:clamp(2.5rem,6vw,3.75rem);line-height:1;letter-spacing:-.03em;
  color:var(--ink);text-transform:none;margin-bottom:.35rem}
.attire{max-width:34rem}
.attire h3{margin:0 0 .5rem;font-family:var(--display);font-weight:400;font-size:1.375rem}
.attire p{margin:0;font-size:1rem;color:var(--muted)}

/* ---------- wedding party: portrait plates ---------- */
.avatar{display:block;overflow:hidden;background:var(--panel);position:relative;
  border:1px solid var(--rule);transition:border-color .45s var(--ease)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar__mark{width:100%;height:100%;display:block;fill:#CFC6A8}

/* the five honoured roles run large, across the top */
.honours{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(.75rem,2vw,1.5rem);
  margin:0 0 clamp(2.5rem,6vw,4rem);padding:0;list-style:none;border:0}
.honour{display:block;border:0;padding:0}
.honour:hover{padding-left:0}
.honour .avatar{aspect-ratio:3/4;margin-bottom:.85rem}
.honour:hover .avatar{border-color:var(--gold)}
.honour__name{margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(.9375rem,1.9vw,1.25rem);line-height:1.2;letter-spacing:-.01em}
.honour__role{margin:.35rem 0 0;font-size:.5625rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold)}
@media (max-width:820px){.honours{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.honours{grid-template-columns:repeat(2,1fr)}}

/* everyone else, smaller, in a wide grid */
.roster{columns:auto;display:grid;grid-template-columns:repeat(4,1fr);
  gap:clamp(1rem,2.5vw,1.75rem);padding-top:1.75rem;border-top:1px solid var(--ink)}
@media (max-width:820px){.roster{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.roster{grid-template-columns:repeat(2,1fr)}}
.member{border-bottom:0;padding-block:0}
.member .avatar{aspect-ratio:1;margin-bottom:.6rem}
.member:hover .avatar{border-color:var(--gold)}
.member__name{font-size:.9375rem;line-height:1.3}
.member__role{font-size:.5625rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin-top:.2rem}

/* ---------- wedding party ---------- */
.honours{margin:0 0 clamp(2rem,5vw,3rem);padding:0;list-style:none}
.honour{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;
  gap:.35rem 2rem;border-top:1px solid var(--hair);padding-block:clamp(1rem,2.5vw,1.5rem);
  transition:padding-left .4s var(--ease)}
.honour:hover{padding-left:.6rem}
.honour__name{margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(1.5rem,3.6vw,2.25rem);line-height:1.1;letter-spacing:-.015em}
.honour__role{margin:0;font-size:.6875rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold)}
.roster{columns:3;column-gap:clamp(2rem,5vw,4rem);padding-top:1.5rem;border-top:1px solid var(--ink)}
@media (max-width:820px){.roster{columns:2}}
@media (max-width:520px){.roster{columns:1}}
.member{break-inside:avoid;padding-block:.7rem;border-bottom:1px solid var(--hair)}
.member p{margin:0}
.member__name{font-size:1.0625rem;line-height:1.35}
.member__role{font-size:.625rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:.1rem}

/* ---------- questions ---------- */
.faq{max-width:52rem}
.faq__item{border-top:1px solid var(--hair)}
.faq__item:last-child{border-bottom:1px solid var(--hair)}
.faq__q{margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(1.125rem,2.6vw,1.5rem);line-height:1.3;letter-spacing:-.01em}
.faq__q button{all:unset;display:flex;align-items:center;justify-content:space-between;
  gap:1.5rem;width:100%;box-sizing:border-box;cursor:pointer;
  padding:1.4rem 0;min-height:3rem;transition:color .3s}
.faq__q button:hover{color:var(--gold)}
.faq__q i{flex:none;width:15px;height:15px;position:relative;transition:transform .45s var(--ease)}
.faq__q i::before,.faq__q i::after{content:"";position:absolute;background:var(--gold);left:50%;top:50%}
.faq__q i::before{width:15px;height:1px;transform:translate(-50%,-50%)}
.faq__q i::after{width:1px;height:15px;transform:translate(-50%,-50%)}
.faq__item[data-open="true"] .faq__q i{transform:rotate(135deg)}
.faq__a{overflow:hidden;max-height:0;transition:max-height .55s var(--ease)}
.faq__a p{margin:0 0 1.4rem;font-size:1rem;color:var(--muted);max-width:42rem}

/* ---------- registry ---------- */
.registry{max-width:44rem}
.registry > p{margin:0 0 1.75rem;font-size:1.0625rem}
.registry__soon{font-style:italic;color:var(--muted);padding-left:1rem;border-left:1px solid var(--gold)}
.registry__links{display:flex;flex-wrap:wrap;gap:.75rem}
.registry__link{display:inline-block;font-family:var(--display);font-size:1.25rem;
  text-decoration:none;color:var(--ink);border:1px solid var(--rule);padding:.8rem 1.75rem;
  transition:background .35s var(--ease),color .35s,border-color .35s}
.registry__link:hover{background:var(--ink);color:var(--base);border-color:var(--ink)}

/* ---------- gallery: framed prints, hung across the full width ---------- */
.gallery{display:grid;gap:clamp(1rem,2.5vw,2rem);grid-template-columns:1fr}
.frame{position:relative;margin:0;cursor:pointer;background:var(--panel);
  border:1px solid var(--rule);padding:clamp(.6rem,1.4vw,1rem);overflow:hidden;
  transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .5s var(--ease)}
.frame::after{content:"";position:absolute;inset:clamp(.6rem,1.4vw,1rem);
  border:1px solid var(--gold);opacity:.32;pointer-events:none;z-index:2}
.frame:hover{transform:translateY(-4px);border-color:var(--gold);
  box-shadow:0 26px 52px -34px rgba(0,0,0,.45)}
.frame > img,.frame > .frame__empty{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.frame > img{transition:transform 1.2s var(--ease)}
.frame:hover > img{transform:scale(1.03)}
.frame--wide > img,.frame--wide > .frame__empty{aspect-ratio:16/9}
.frame__empty{display:grid;place-content:center;text-align:center;gap:.4rem;
  background:linear-gradient(155deg,var(--tint) 0%,var(--edge) 100%);
  font-size:.625rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.frame__empty b{display:block;font-family:var(--display);font-size:2rem;
  letter-spacing:-.02em;color:var(--gold);text-transform:none}
@media (min-width:760px){
  .gallery{grid-template-columns:repeat(3,1fr)}
  .frame--wide{grid-column:1 / -1}
}

/* ---------- footer ---------- */
.footer{background:var(--ink);color:var(--base);
  padding:clamp(4.5rem,10vw,7rem) var(--pad) clamp(5.5rem,10vw,7rem)}
.footer__rings{display:flex;gap:-0;margin:0 0 clamp(2rem,5vw,3rem)}
.footer__rings span{display:block;width:1.75rem;height:1.75rem;border:1px solid var(--gold);
  border-radius:50%;margin-right:-.6rem}
.footer h2{margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(1.75rem,6vw,3.5rem);line-height:1.1;letter-spacing:-.025em}
.footer__meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;
  gap:.6rem 2.5rem;margin-top:clamp(2.5rem,6vw,3.5rem);padding-top:1.35rem;
  border-top:1px solid rgba(253,255,248,.22)}
.footer__meta p{margin:0;font-size:.6875rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold-dim)}
.footer a{color:var(--gold-dim);text-decoration:none;text-transform:none;letter-spacing:.04em;
  border-bottom:1px solid rgba(235,214,144,.35)}
.footer a:hover{color:var(--base);border-bottom-color:var(--base)}

.lightbox{position:fixed;inset:0;z-index:200;display:none;place-items:center;
  background:rgba(0,0,0,.92);padding:clamp(1rem,5vw,3rem)}
.lightbox.is-open{display:grid}
.lightbox__stage{margin:0;max-width:min(74rem,92vw);display:flex;flex-direction:column;
  align-items:center;gap:1rem}
.lightbox__stage img{max-width:100%;max-height:78vh;object-fit:contain}
.lightbox__stage figcaption{color:rgba(255,255,255,.72);font-size:.875rem;text-align:center}
.lightbox button{position:absolute;background:none;border:0;cursor:pointer;
  color:rgba(255,255,255,.75);transition:color .3s;line-height:1}
.lightbox button:hover{color:#fff}
.lightbox__close{top:1.25rem;right:1.5rem;font-size:2.25rem}
.lightbox__nav{top:50%;transform:translateY(-50%);font-size:3rem;padding:1rem}
.lightbox__nav--prev{left:.5rem}
.lightbox__nav--next{right:.5rem}
</style>
</head>
<body>
<a class="skip" href="#story">Skip to content</a>
<div class="progress" id="progress"></div>

<nav class="dock" id="dock" aria-label="Sections">
  <div class="dock__scroll">
    <div class="dock__inner">
      <span class="dock__marker" aria-hidden="true"></span>
      <a href="#story"     data-target="story">Story</a>
      <a href="#day"       data-target="day">The day</a>
      <a href="#party"     data-target="party">Party</a>
      <a href="#gallery-sec" data-target="gallery-sec">Photos</a>
      <a href="#registry"  data-target="registry">Registry</a>
      <a href="#questions" data-target="questions">Questions</a>
    </div>
  </div>
  <span class="dock__rail" aria-hidden="true"></span>
</nav>

<header class="hero scene-host" id="top" data-scene="hero" data-scene-opacity=".74" data-scene-position="center 35%">
  <p class="hero__place" id="heroPlace"></p>
  <h1 id="names"></h1>
  <div class="hero__foot">
    <p id="heroDate"></p>
    <p class="dim" id="heroCount"></p>
  </div>
</header>

<main>
  <section class="band scene-host" id="story" aria-labelledby="story-t"
           data-scene="story" data-scene-opacity=".34">
    <div class="band__head" data-reveal>
      <h2 id="story-t"></h2>
      <p>Since 2016</p>
    </div>
    <ol class="years" id="chapters"></ol>
    <dl class="traits" id="traits" data-reveal></dl>
  </section>

  <section class="band scene-host" id="day" aria-labelledby="day-t"
           data-scene="day" data-scene-opacity=".26">
    <div class="band__head" data-reveal>
      <h2 id="day-t">The Day</h2>
      <p id="dayKicker"></p>
    </div>
    <ol class="slots" id="slots"></ol>
    <div class="dayfoot">
      <p class="countdown" id="countdown" data-reveal></p>
      <div class="attire" data-reveal>
        <h3>What to wear</h3>
        <p id="attire"></p>
      </div>
    </div>
  </section>

  <section class="band" id="party" aria-labelledby="party-t">
    <div class="band__head" data-reveal>
      <h2 id="party-t">Standing With Us</h2>
      <p id="partyCount"></p>
    </div>
    <ol class="honours" id="honours" data-reveal></ol>
    <div class="roster" id="roster" data-reveal></div>
  </section>

  <section class="band" id="gallery-sec" aria-labelledby="g-t">
    <div class="band__head" data-reveal>
      <h2 id="g-t">Photographs</h2>
      <p>A few of them</p>
    </div>
    <div class="gallery" id="gallery" data-reveal></div>
  </section>

  <section class="band" id="registry" aria-labelledby="r-t">
    <div class="band__head" data-reveal>
      <h2 id="r-t">Registry</h2>
      <p>If you would like to</p>
    </div>
    <div class="registry" id="registry-body" data-reveal></div>
  </section>

  <section class="band" id="questions" aria-labelledby="q-t">
    <div class="band__head" data-reveal>
      <h2 id="q-t">Questions</h2>
      <p>Before you come</p>
    </div>
    <div class="faq" id="faqList" data-reveal></div>
  </section>
</main>

<footer class="footer scene-host" data-scene="footer" data-scene-opacity=".74" data-scene-position="center 75%" data-scene-zoom="0.95">
  <div class="footer__rings" aria-hidden="true"><span></span><span></span><span></span></div>
  <h2 id="fNames"></h2>
  <div class="footer__meta">
    <p id="fDate"></p>
    <p id="fContact"></p>
  </div>
</footer>

<!-- Client content. Replace this file per couple; nothing else changes. -->
<script src="site-data.js"></script>
<!-- Shared engine. Identical in every concept - edit once, all three follow. -->
<script src="engine.js"></script>

<script>

const $ = id => document.getElementById(id);

/* ---------- render ---------- */
$("names").innerHTML =
  "<span><i>" + esc(W.names[0]) + "</i></span>" +
  "<span><i><em>and</em></i></span>" +
  "<span><i>" + esc(W.names[1]) + "</i></span>";
$("heroPlace").textContent = W.locality;
$("heroDate").textContent = W.date.medium;

const left = daysUntil();
const countText = left > 0 ? left + " day" + (left === 1 ? "" : "s") + " to go"
                : (left === 0 ? "Today" : "Married");
$("heroCount").textContent = countText;

$("story-t").textContent = W.storyHeadline;
$("chapters").innerHTML = W.chapters.map((c, i) => `
  <li class="year" data-reveal style="--i:${i}">
    <p class="year__when">${esc(c.date)}${c.location ? `<span class="year__where">${esc(c.location)}</span>` : ""}</p>
    <div class="year__body">
      <h3>${esc(c.title)}</h3>
      <p>${esc(c.body)}</p>
    </div>
  </li>`).join("");
$("traits").innerHTML = W.traits
  .map(t => "<div><dt>" + esc(t.who) + "</dt><dd>" + esc(t.bio) + "</dd></div>").join("");

$("dayKicker").textContent = W.date.medium;
$("slots").innerHTML = W.events.map((e, i) => `
  <li class="slot" data-reveal style="--i:${i}">
    <div>
      <p class="slot__hour">${esc(e.clock)}</p>
    </div>
    <div class="slot__body">
      <h3>${esc(e.name)}</h3>
      <p class="slot__when">${esc(e.formal)}</p>
      <p class="slot__venue">${esc(e.venue)}</p>
      <p class="slot__addr"><a href="${esc(e.maps)}" target="_blank" rel="noopener">${esc(e.address)}</a></p>
      <p class="slot__about">${esc(e.about)}</p>
      ${e.tradition ? `<div class="aside"><h4>A note on the ceremony</h4><p>${esc(e.tradition)}</p></div>` : ""}
      ${e.note.trim() ? `<p class="slot__note">${esc(e.note.trim())}</p>` : ""}
    </div>
  </li>`).join("");
$("attire").textContent = W.attire;

$("gallery").innerHTML = galleryItems().map((g, i) =>
  '<figure class="frame' + (i % 4 === 0 ? " frame--wide" : "") + '" data-shot="' + i + '">' +
  frame(g) + "</figure>").join("");
$("registry-body").innerHTML = "<p>" + esc(W.registry.intro) + "</p>" + registryHTML();


$("countdown").innerHTML = left > 0
  ? "<b>" + left + "</b>day" + (left === 1 ? "" : "s") + " to go"
  : (left === 0 ? "<b>Today</b>" : "<b>&mdash;</b>married");

const honoured = W.party.filter(m => m.honored);
const rest = W.party.filter(m => !m.honored);
$("partyCount").textContent = W.party.length + " of them";
$("honours").innerHTML = honoured.map(m => `
  <li class="honour">
    ${avatar(m)}
    <p class="honour__name">${esc(m.name)}</p>
    <p class="honour__role">${esc(m.role)}</p>
  </li>`).join("");
$("roster").innerHTML = rest.map(m => `
  <div class="member">
    ${avatar(m)}
    <p class="member__name">${esc(m.name)}</p>
    <p class="member__role">${esc(m.role)}</p>
  </div>`).join("");

$("faqList").innerHTML = W.faq.map(f => `
  <div class="faq__item" data-open="false">
    <h3 class="faq__q"><button type="button" aria-expanded="false">${esc(f.q)}<i></i></button></h3>
    <div class="faq__a"><p>${esc(f.a)}</p></div>
  </div>`).join("");

$("fNames").innerHTML = esc(W.legalNames[0]) + "<br>" + esc(W.legalNames[1]);
$("fDate").textContent = W.date.medium + " — " + W.locality;
$("fContact").textContent = daysUntil() > 0 ? daysUntil() + " days to go" : "";

/* ---------- behaviour ---------- */
const setPanel = (item, open) => {
  const panel = item.querySelector(".faq__a"), btn = item.querySelector("button");
  item.dataset.open = String(open);
  btn.setAttribute("aria-expanded", String(open));
  panel.style.maxHeight = open ? panel.scrollHeight + "px" : "0px";
};
document.querySelectorAll(".faq__item").forEach(item => {
  setPanel(item, false);
  item.querySelector("button").addEventListener("click", () =>
    setPanel(item, item.dataset.open !== "true"));
});
addEventListener("resize", () => {
  document.querySelectorAll('.faq__item[data-open="true"]').forEach(i => setPanel(i, true));
});

/* Whichever year sits nearest the middle of the screen holds focus. */
function initStoryFocus() {
  const rows = [...document.querySelectorAll(".year")];
  if (!rows.length) return;
  if (REDUCED || !("IntersectionObserver" in window)) {
    rows.forEach(r => r.classList.add("is-focus"));
    return;
  }
  $("chapters").classList.add("is-focusable");
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      rows.forEach(r => r.classList.toggle("is-focus", r === e.target));
    });
  }, { rootMargin: "-45% 0px -45% 0px" });
  rows.forEach(r => io.observe(r));
  rows[0].classList.add("is-focus");
}

paintScenes();
initStoryBackdrop();
initStoryFocus();
initMotion();
initDock(["story","day","party","gallery-sec","registry","questions"]);
initLightbox($("gallery"));
requestAnimationFrame(() => document.body.classList.add("is-loaded"));
</script>
</body>
</html>
