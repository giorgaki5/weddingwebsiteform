<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPLACE — Partner One &amp; Partner Two</title> <meta name="description" content="REPLACE with a one-line description of the couple and the date."> <!-- The head is NOT driven by site-data.js. Set these by hand per client:      title, description, canonical, theme-color, favicon, and the og:/      twitter: tags. og:image must be an absolute URL on the client domain. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#FBF6EA;
  --surface:#FFFDF6;
  --deep:#F4EAD6;
  --ink:#000000;
  --gold:#D19D01;
  --gold-soft:rgba(209,157,1,.34);
  --muted:#7C7263;
  --rule:rgba(0,0,0,.16);
  --hair:rgba(0,0,0,.07);
  --tonal:#E9DFC9;
  --display:"Italiana",Georgia,serif;
  --body:"EB Garamond",Georgia,serif;
  --gutter:clamp(1.5rem,6vw,4rem);
  --ease:cubic-bezier(.16,.84,.44,1);
  --dock-bg:rgba(251,246,234,.85);
  --dock-rule:var(--rule);
  --dock-ink:var(--ink);
  --dock-muted:var(--muted);
  --dock-accent:var(--gold);
  --dock-active-bg:var(--ink);
  --dock-active-ink:var(--surface);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;padding-bottom:5rem;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-size:1.1875rem;line-height:1.72;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.skip{position:absolute;left:-9999px;background:var(--ink);color:var(--surface);padding:.75rem 1rem;z-index:120}
.skip:focus{left:0;top:0}
.column{max-width:41rem;margin-inline:auto;padding-inline:var(--gutter)}

/* ============ motion system ============ */
[data-reveal]{
  opacity:0;transform:translateY(18px);
  transition:opacity .95s var(--ease),transform .95s var(--ease);
  transition-delay:calc(var(--i,0) * 90ms);
}
[data-reveal].is-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  [data-reveal]{opacity:1!important;transform:none!important;transition:none!important}
  *{animation:none!important}
}

/* scroll progress hairline */
.progress{
  position:fixed;top:0;left:0;height:2px;width:100%;z-index:110;
  background:var(--gold);transform:scaleX(0);transform-origin:0 50%;
  transition:transform .12s linear;
}

/* ============ navigation: shared dock ============ */

/* ============ shared devices ============ */
.divider{display:block;margin:0 auto;width:min(9rem,40%);border:0}
.divider::before,.divider::after{content:"";display:block;background:var(--gold);height:1px;
  transform:scaleX(0);transform-origin:50%;transition:transform 1.1s var(--ease) .2s}
.divider::after{height:2px;margin-top:3px}
.divider.is-in::before,.divider.is-in::after{transform:none}

.section{padding-block:clamp(4.5rem,11vw,8rem);text-align:center;position:relative}
.section + .section{border-top:1px solid var(--hair)}
.section__title{
  font-family:var(--display);font-weight:400;
  font-size:clamp(1.75rem,5.5vw,2.5rem);letter-spacing:.06em;line-height:1.2;margin:0 0 1.5rem;
}
.section__title + .divider{margin-bottom:2.75rem}

/* SCENE — photography as background layers (see PHOTOS in the script) */
.scene{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.scene__img{position:absolute;inset:-12%;transition:opacity 1.3s var(--ease);background-size:cover;background-position:center;
  filter:saturate(.9) contrast(1.02);will-change:transform;transform:scale(1.05)}
.scene__veil{position:absolute;inset:0}
.footer .scene__img{inset:-6%}
.scene-host{position:relative;isolation:isolate}
.scene-host > *:not(.scene){position:relative;z-index:1}
.hero .scene__veil{background:radial-gradient(120% 85% at 50% 0%, rgba(251,246,234,.2) 0%, rgba(251,246,234,.56) 55%, var(--ground) 100%)}
.hero .scene--empty .scene__veil{background:none}
#story .scene__veil{background:linear-gradient(to bottom,var(--ground) 0%,rgba(251,246,234,.66) 20%,rgba(251,246,234,.66) 80%,var(--ground) 100%)}
#story .scene--empty .scene__veil{background:none}
#day .scene__veil{background:linear-gradient(to bottom,var(--ground) 0%,rgba(251,246,234,.6) 24%,rgba(251,246,234,.6) 72%,var(--ground) 100%)}
#day .scene--empty .scene__veil{background:var(--surface);opacity:.55}
.footer .scene__veil{background:linear-gradient(to bottom,rgba(251,246,234,.46),var(--ground))}
.footer .scene--empty .scene__veil{background:none}

/* ============ hero ============ */
.hero{min-height:100svh;display:grid;place-items:center;padding:5rem var(--gutter);position:relative}
.card{
  background:var(--surface);border:1px solid var(--rule);
  padding:clamp(3rem,8vw,5.5rem) clamp(1.75rem,6vw,4.5rem);
  text-align:center;max-width:38rem;width:100%;position:relative;
  opacity:0;transform:translateY(26px) scale(.985);
  transition:opacity 1.2s var(--ease),transform 1.2s var(--ease);
}
.is-loaded .card{opacity:1;transform:none}
.card::after{
  content:"";position:absolute;inset:9px;border:1px solid var(--gold);opacity:0;
  transition:opacity 1s var(--ease) .55s;pointer-events:none;
}
.is-loaded .card::after{opacity:.34}
.card > *{opacity:0;transform:translateY(14px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.is-loaded .card > *{opacity:1;transform:none}
.is-loaded .card__eyebrow{transition-delay:.35s}
.is-loaded .card__names{transition-delay:.5s}
.is-loaded .card .divider{transition-delay:.75s}
.is-loaded .card__date{transition-delay:.85s}
.is-loaded .card__place{transition-delay:.95s}
.card__eyebrow{font-family:var(--display);font-size:.875rem;letter-spacing:.34em;color:var(--muted);margin:0 0 2rem}
.card__names{font-family:var(--display);font-weight:400;font-size:clamp(2.75rem,11vw,4.75rem);
  line-height:1.06;letter-spacing:.02em;margin:0}
.card__amp{display:block;font-family:var(--body);font-style:italic;font-size:.36em;
  letter-spacing:0;color:var(--gold);line-height:2.1}
.card__date{font-style:italic;font-size:1.125rem;color:var(--muted);margin:2rem 0 .35rem;line-height:1.6}
.card__place{font-family:var(--display);font-size:.9375rem;letter-spacing:.2em;margin:0}
.card .divider{margin-block:2.25rem}
.scroll-cue{
  position:absolute;bottom:2.25rem;left:50%;transform:translateX(-50%);
  font-style:italic;font-size:.9375rem;color:var(--muted);opacity:0;
  transition:opacity .8s 1.4s;
}
.is-loaded .scroll-cue{opacity:1}
.scroll-cue i{display:block;width:1px;height:2.25rem;background:var(--gold-soft);margin:.6rem auto 0;
  animation:drip 2.6s var(--ease) infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:50% 0}
  45%{transform:scaleY(1);transform-origin:50% 0}
  55%{transform:scaleY(1);transform-origin:50% 100%}
  100%{transform:scaleY(0);transform-origin:50% 100%}}

/* ============ story ============ */
.chapters{list-style:none;margin:0;padding:0;text-align:left}
.chapter{padding-block:clamp(1.75rem,4vw,2.5rem);transition:opacity .7s var(--ease)}
.chapter + .chapter{border-top:1px solid var(--hair)}
.is-focusable .chapter{opacity:.32}
.is-focusable .chapter.is-focus{opacity:1}
.chapter__when{margin:0 0 .5rem;font-family:var(--display);font-size:.75rem;
  letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-align:center}
.chapter__when span{display:block;margin-top:.35rem;font-family:var(--body);
  font-style:italic;text-transform:none;letter-spacing:0;font-size:.9375rem;color:var(--muted)}
.chapter__title{margin:0 0 .85rem;font-family:var(--display);font-weight:400;
  font-size:clamp(1.375rem,4vw,1.75rem);letter-spacing:.06em;text-align:center;line-height:1.25}
.chapter__body{margin:0;font-size:1.0625rem;line-height:1.78}
.prose{text-align:left}
.prose p{margin:0 0 1.3em}
.prose p:last-child{margin-bottom:0}
.lede{font-style:italic;font-size:1.3125rem;line-height:1.6;text-align:center;color:var(--muted);margin-bottom:2.25rem}
.traits{margin:3rem 0 0;padding-top:2rem;border-top:1px solid var(--hair)}
.traits p{margin:0 0 .4rem;font-size:1.0625rem}
.traits span{font-family:var(--display);letter-spacing:.14em;font-size:.875rem;color:var(--gold)}

/* ============ TIMELINE — each stop its own card on a gold spine ============ */
.timeline{position:relative;padding-block:1rem}
.timeline::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--gold-soft) 8%,var(--gold-soft) 92%,transparent);
  transform:translateX(-50%) scaleY(0);transform-origin:50% 0;
  transition:transform 1.6s var(--ease);
}
.timeline.is-in::before{transform:translateX(-50%) scaleY(1)}

.stop{position:relative;padding-block:clamp(1.75rem,4vw,2.5rem)}
.stop__node{
  width:9px;height:9px;background:var(--ground);border:1px solid var(--gold);
  transform:rotate(45deg);margin:0 auto clamp(1.5rem,3vw,2rem);
  position:relative;z-index:2;
}
.stop__node::after{
  content:"";position:absolute;inset:2px;background:var(--gold);opacity:0;
  transition:opacity .6s var(--ease) .3s;
}
.stop.is-in .stop__node::after{opacity:1}
@media (max-width:620px){
  .card{padding:2.5rem 1.4rem}
  .card::after{inset:7px}
  .stop__card{padding:1.75rem 1.35rem}
}
.stop__card{
  background:var(--surface);border:1px solid var(--rule);
  padding:clamp(2rem,5vw,3rem) clamp(1.5rem,5vw,3rem);
  position:relative;z-index:1;
  transition:box-shadow .5s var(--ease),transform .5s var(--ease),border-color .5s var(--ease);
}
.stop__card:hover{transform:translateY(-3px);border-color:var(--gold-soft);box-shadow:0 14px 34px -22px rgba(0,0,0,.3)}
.stop__clock{font-family:var(--display);font-size:clamp(2rem,7vw,2.75rem);line-height:1;
  margin:0 0 .6rem;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.stop__clock span{display:block;font-family:var(--body);font-style:italic;font-size:.4em;
  letter-spacing:0;color:var(--muted);margin-top:.5rem}
.stop__name{font-family:var(--display);font-size:clamp(1.25rem,4vw,1.625rem);letter-spacing:.14em;
  margin:0 0 1.2rem;color:var(--muted)}
.stop__when{font-style:italic;color:var(--muted);margin:0 0 1.6rem;font-size:1rem}
.stop__venue{font-size:1.125rem;margin:0 0 .2rem}
.stop__addr{margin:0 0 1.4rem}
.stop__addr a{font-style:italic;font-size:1.0625rem;color:var(--muted);text-decoration:none;
  border-bottom:1px solid var(--rule);transition:color .3s,border-color .3s}
.stop__addr a:hover{color:var(--gold);border-bottom-color:var(--gold)}
.stop__about{margin:0}
.stop__note{font-size:.9375rem;color:var(--muted);font-style:italic;margin:1.4rem auto 0;max-width:28rem}

/* the Stefana, demoted: a quiet aside inside the ceremony stop */
.aside{
  margin:1.75rem auto 0;padding:1.25rem 0 0;border-top:1px solid var(--hair);
  max-width:30rem;text-align:left;
}
.aside h4{
  font-family:var(--display);font-size:.75rem;letter-spacing:.26em;color:var(--gold);
  margin:0 0 .5rem;font-weight:400;
}
.aside p{margin:0;font-size:1rem;line-height:1.65;color:var(--muted)}

.countdown{font-style:italic;color:var(--muted);margin:0 0 2.5rem;font-size:1.0625rem}
.countdown b{font-family:var(--display);font-style:normal;font-size:1.5rem;color:var(--ink);
  letter-spacing:.04em;font-weight:400}

.attire{margin-top:3rem;padding-top:2.5rem;border-top:1px solid var(--hair)}
.attire h3{font-family:var(--display);font-size:1.375rem;letter-spacing:.12em;margin:0 0 .85rem}
.attire p{margin:0;max-width:32rem;margin-inline:auto}

/* ============ registry ============ */
.registry{max-width:32rem;margin-inline:auto}
.registry > p{margin:0 0 1.5rem}
.registry__soon{font-style:italic;color:var(--muted)}
.registry__links{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem}
.registry__link{display:inline-block;font-family:var(--display);font-size:1rem;
  letter-spacing:.12em;text-decoration:none;color:var(--ink);border:1px solid var(--rule);
  padding:.8rem 1.75rem;transition:background .35s var(--ease),color .35s,border-color .35s}
.registry__link:hover{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ============ gallery: a filmstrip, running off the page edge ============ */
.strip{display:flex;gap:clamp(.6rem,1.5vw,1rem);overflow-x:auto;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:1.25rem;
  padding-left:var(--gutter);scrollbar-width:none;-ms-overflow-style:none;cursor:grab}
.strip::-webkit-scrollbar{display:none}
.strip.is-dragging{cursor:grabbing;scroll-snap-type:none}
.strip figure{margin:0;flex:0 0 auto;width:clamp(14rem,32vw,21rem);aspect-ratio:4/5;
  position:relative;overflow:hidden;background:var(--tonal);scroll-snap-align:start;
  cursor:pointer;border:1px solid var(--rule);padding:clamp(.5rem,1.2vw,.75rem);
  transition:border-color .5s var(--ease)}
.strip figure::after{content:"";position:absolute;inset:clamp(.5rem,1.2vw,.75rem);
  border:1px solid var(--gold);opacity:.28;pointer-events:none;z-index:2}
.strip figure:hover{border-color:var(--gold)}
.strip figure:last-child{margin-right:var(--gutter)}
.strip figure > img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.strip figure:hover > img{transform:scale(1.04)}
.frame__empty{width:100%;height:100%;display:grid;place-content:center;text-align:center;gap:.35rem;
  background:linear-gradient(155deg,#F1E7D1 0%,#E4D8BC 100%);
  font-family:var(--display);font-size:.6875rem;letter-spacing:.22em;
  text-transform:uppercase;color:#8A7C5F}
.frame__empty b{display:block;font-size:1.75rem;letter-spacing:-.01em;
  text-transform:none;font-weight:400;color:var(--gold)}
.strip__meta{max-width:41rem;margin:1.25rem auto 0;padding:1rem var(--gutter) 0;
  border-top:1px solid var(--hair);display:flex;justify-content:space-between;
  align-items:baseline;gap:1rem;font-family:var(--display);font-size:.75rem;
  letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.strip__meta p{margin:0}
.strip__meta b{font-size:1.25rem;letter-spacing:.04em;color:var(--ink);
  text-transform:none;font-weight:400}

/* ============ party: circular portraits ============ */
.faces{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(1.5rem,4vw,2.25rem) 1rem}
@media (min-width:560px){.faces{grid-template-columns:repeat(3,1fr)}}
.face{text-align:center}
.avatar{display:block;width:clamp(4.5rem,17vw,6.5rem);aspect-ratio:1;margin:0 auto .85rem;
  border-radius:50%;overflow:hidden;background:var(--tonal);
  border:1px solid var(--rule);position:relative;
  transition:border-color .45s var(--ease),transform .45s var(--ease)}
.face:hover .avatar{border-color:var(--gold);transform:translateY(-3px)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar__mark{width:100%;height:100%;display:block;fill:#C9BC9C}
.face--honored .avatar{border-color:var(--gold-soft,rgba(209,157,1,.45))}
.face__name{margin:0;font-size:1rem;line-height:1.35}
.face__role{margin:.25rem 0 0;font-family:var(--display);font-size:.6875rem;
  letter-spacing:.18em;color:var(--muted)}
.face--honored .face__role{color:var(--gold)}

/* ============ party ============ */
.member{padding-block:.95rem;border-bottom:1px solid var(--hair);transition:padding-left .35s var(--ease)}
.member:first-child{border-top:1px solid var(--rule)}
.member:hover{padding-left:.5rem}
.member__name{margin:0;font-size:1.125rem;line-height:1.4}
.member__role{font-family:var(--display);font-size:.8125rem;letter-spacing:.18em;color:var(--muted);margin:.15rem 0 0}
.member--honored .member__role{color:var(--gold)}

/* ============ faq ============ */
.faq{text-align:left}
.faq__item{padding-block:1.6rem;border-bottom:1px solid var(--hair)}
.faq__item:first-child{border-top:1px solid var(--rule)}
.faq__q{font-family:var(--display);font-size:1.1875rem;letter-spacing:.05em;margin:0 0 .5rem}
.faq__a{margin:0;color:var(--muted);font-size:1.0625rem}

/* ============ footer ============ */
.footer{padding:clamp(4rem,10vw,7rem) var(--gutter);text-align:center;border-top:1px solid var(--rule)}
.footer__names{font-family:var(--display);font-size:clamp(1.375rem,4vw,1.875rem);letter-spacing:.08em;line-height:1.6;margin:0}
.footer .divider{margin-block:2rem}
.footer__meta{font-style:italic;color:var(--muted);margin:0;line-height:1.9}
.footer__meta a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
.footer__meta a:hover{color:var(--gold);border-bottom-color:var(--gold)}

.lightbox{position:fixed;inset:0;z-index:200;display:none;place-items:center;
  background:rgba(0,0,0,.92);padding:clamp(1rem,5vw,3rem)}
.lightbox.is-open{display:grid}
.lightbox__stage{margin:0;max-width:min(74rem,92vw);display:flex;flex-direction:column;
  align-items:center;gap:1rem}
.lightbox__stage img{max-width:100%;max-height:78vh;object-fit:contain}
.lightbox__stage figcaption{color:rgba(255,255,255,.72);font-size:.875rem;text-align:center}
.lightbox button{position:absolute;background:none;border:0;cursor:pointer;
  color:rgba(255,255,255,.75);transition:color .3s;line-height:1}
.lightbox button:hover{color:#fff}
.lightbox__close{top:1.25rem;right:1.5rem;font-size:2.25rem}
.lightbox__nav{top:50%;transform:translateY(-50%);font-size:3rem;padding:1rem}
.lightbox__nav--prev{left:.5rem}
.lightbox__nav--next{right:.5rem}
</style>
</head>
<body>
<a class="skip" href="#story">Skip to content</a>
<div class="progress" id="progress"></div>

<nav class="dock" id="dock" aria-label="Sections">
  <div class="dock__scroll">
    <div class="dock__inner">
      <span class="dock__marker" aria-hidden="true"></span>
      <a href="#story"     data-target="story">Story</a>
      <a href="#day"       data-target="day">The day</a>
      <a href="#party"     data-target="party">Party</a>
      <a href="#gallery-sec" data-target="gallery-sec">Photos</a>
      <a href="#registry"  data-target="registry">Registry</a>
      <a href="#questions" data-target="questions">Questions</a>
    </div>
  </div>
  <span class="dock__rail" aria-hidden="true"></span>
</nav>



<header class="hero scene-host" id="hero" data-scene="hero" data-scene-opacity=".72" data-scene-position="center 35%">
  <div class="card">
    <h1 class="card__names" id="names"></h1>
    <hr class="divider is-in">
    <p class="card__date" id="date"></p>
    <p class="card__place" id="place"></p>
  </div>
  <p class="scroll-cue">scroll<i></i></p>
</header>

<main>
  <section class="section scene-host" id="story" aria-labelledby="story-t" data-scene="story" data-scene-opacity=".34">
    <div class="column">
      <h2 class="section__title" id="story-t" data-reveal></h2>
      <hr class="divider" data-reveal>
      <ol class="chapters" id="story-body"></ol>
      <div class="traits" id="traits" data-reveal></div>
    </div>
  </section>

  <section class="section scene-host" id="day" data-scene="day" data-scene-opacity=".26" aria-labelledby="day-t">
    <div class="column">
      <h2 class="section__title" id="day-t" data-reveal>The Day</h2>
      <hr class="divider" data-reveal>
      <p class="countdown" id="countdown" data-reveal></p>
      <div class="timeline" id="timeline"></div>
      <div class="attire" data-reveal>
        <h3>What to Wear</h3>
        <p id="attire"></p>
      </div>
    </div>
  </section>

  <section class="section" id="party" aria-labelledby="party-t">
    <div class="column">
      <h2 class="section__title" id="party-t" data-reveal>Standing With Us</h2>
      <hr class="divider" data-reveal>
      <div class="faces" id="party-list" data-reveal></div>
    </div>
  </section>

  <section class="section" id="gallery-sec" aria-labelledby="g-t">
    <div class="column">
      <h2 class="section__title" id="g-t" data-reveal>Photographs</h2>
      <hr class="divider" data-reveal>
    </div>
    <div class="strip" id="gallery"></div>
    <div class="strip__meta">
      <p id="stripCount"></p>
      <p>Drag or swipe</p>
    </div>
  </section>

  <section class="section" id="registry" aria-labelledby="r-t">
    <div class="column">
      <h2 class="section__title" id="r-t" data-reveal>Registry</h2>
      <hr class="divider" data-reveal>
      <div class="registry" id="registry-body" data-reveal></div>
    </div>
  </section>

  <section class="section" id="questions" aria-labelledby="q-t">
    <div class="column">
      <h2 class="section__title" id="q-t" data-reveal>Questions</h2>
      <hr class="divider" data-reveal>
      <div class="faq" id="faq-list" data-reveal></div>
    </div>
  </section>
</main>

<footer class="footer scene-host" data-scene="footer" data-scene-opacity=".72" data-scene-position="center 75%" data-scene-zoom="0.95">
  <p class="footer__names" id="f-names" data-reveal></p>
  <hr class="divider" data-reveal>
  <p class="footer__meta" id="f-meta" data-reveal></p>
</footer>

<!-- Client content. Replace this file per couple; nothing else changes. -->
<script src="site-data.js"></script>
<!-- Shared engine. Identical in every concept - edit once, all three follow. -->
<script src="engine.js"></script>

<script>

const $ = id => document.getElementById(id);

/* ---------- render ---------- */
$("names").innerHTML = esc(W.names[0]) + '<span class="card__amp">and</span>' + esc(W.names[1]);
$("date").textContent = W.date.long;
$("place").textContent = W.locality.toUpperCase();

$("story-t").textContent = W.storyHeadline;
$("story-body").innerHTML = W.chapters.map((c, i) => `
  <li class="chapter" data-reveal style="--i:${i}">
    <p class="chapter__when">${esc(c.date)}${c.location ? `<span>${esc(c.location)}</span>` : ""}</p>
    <h3 class="chapter__title">${esc(c.title)}</h3>
    <p class="chapter__body">${esc(c.body)}</p>
  </li>`).join("");
$("traits").innerHTML = W.traits
  .map(t => "<p><span>" + esc(t.who.toUpperCase()) + "</span> &nbsp; " + esc(t.bio) + "</p>").join("");

$("timeline").innerHTML = W.events.map((e, i) => `
  <article class="stop" data-reveal style="--i:${i}">
    <div class="stop__node"></div>
    <div class="stop__card">
      <p class="stop__clock">${esc(e.clock)}</p>
      <h3 class="stop__name">${esc(e.name)}</h3>
      <p class="stop__when">${esc(e.formal)}</p>
      <p class="stop__venue">${esc(e.venue)}</p>
      <p class="stop__addr"><a href="${esc(e.maps)}" target="_blank" rel="noopener">${esc(e.address)}</a></p>
      <p class="stop__about">${esc(e.about)}</p>
      ${e.tradition ? `<div class="aside"><h4>A NOTE ON THE CEREMONY</h4><p>${esc(e.tradition)}</p></div>` : ""}
      ${e.note.trim() ? `<p class="stop__note">${esc(e.note.trim())}</p>` : ""}
    </div>
  </article>`).join("");
$("attire").textContent = W.attire;

const shots = galleryItems();
$("gallery").innerHTML = shots.map((g, i) =>
  '<figure data-shot="' + i + '">' + frame(g) + "</figure>").join("");
$("stripCount").innerHTML = "<b>" + String(shots.length).padStart(2,"0") + "</b> frames";

/* drag to scroll the filmstrip, for anyone without a trackpad */
(function dragStrip(){
  const strip = $("gallery");
  let down = false, startX = 0, startLeft = 0, moved = 0;
  strip.addEventListener("pointerdown", e => {
    down = true; moved = 0; startX = e.clientX; startLeft = strip.scrollLeft;
    strip.classList.add("is-dragging");
  });
  addEventListener("pointerup", () => { down = false; strip.classList.remove("is-dragging"); });
  strip.addEventListener("pointermove", e => {
    if (!down) return;
    const dx = e.clientX - startX;
    moved = Math.max(moved, Math.abs(dx));
    strip.scrollLeft = startLeft - dx;
  });
  strip.addEventListener("click", e => { if (moved > 6) e.stopPropagation(); }, true);
})();
$("registry-body").innerHTML = "<p>" + esc(W.registry.intro) + "</p>" + registryHTML();

$("party-list").innerHTML = W.party.map(m => `
  <div class="face${m.honored ? " face--honored" : ""}">
    ${avatar(m)}
    <p class="face__name">${esc(m.name)}</p>
    <p class="face__role">${esc(m.role.toUpperCase())}</p>
  </div>`).join("");

$("faq-list").innerHTML = W.faq.map(f => `
  <div class="faq__item">
    <h3 class="faq__q">${esc(f.q)}</h3>
    <p class="faq__a">${esc(f.a)}</p>
  </div>`).join("");

$("f-names").innerHTML = esc(W.legalNames[0]) + "<br>" + esc(W.legalNames[1]);
$("f-meta").innerHTML = esc(W.date.short) + "<br>" + esc(W.locality);

const left = daysUntil();
$("countdown").innerHTML = left > 0
  ? "<b>" + left + "</b> day" + (left === 1 ? "" : "s") + " to go"
  : (left === 0 ? "<b>Today</b>" : "Married");

/* ---------- behaviour ---------- */
function initStoryFocus() {
  const rows = [...document.querySelectorAll(".chapter")];
  if (!rows.length) return;
  if (REDUCED || !("IntersectionObserver" in window)) {
    rows.forEach(r => r.classList.add("is-focus")); return;
  }
  $("story-body").classList.add("is-focusable");
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) rows.forEach(r => r.classList.toggle("is-focus", r === e.target));
  }), { rootMargin: "-45% 0px -45% 0px" });
  rows.forEach(r => io.observe(r));
  rows[0].classList.add("is-focus");
}

initStoryFocus();
paintScenes();
initStoryBackdrop();
initMotion();
initDock(["story","day","party","gallery-sec","registry","questions"]);
initLightbox($("gallery"));
requestAnimationFrame(() => document.body.classList.add("is-loaded"));
</script>
</body>
</html>
