<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPLACE — Partner One &amp; Partner Two</title>
<meta name="description" content="REPLACE with a one-line description of the couple and the date.">
<!-- The head is NOT driven by site-data.js. Set these by hand per client:
     title, description, canonical, theme-color, favicon, and the og:/
     twitter: tags. og:image must be an absolute URL on the client domain. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#FBF7EC;
  --paper:#F1E9D8;
  --deep:#E6DAC2;
  --ink:#000000;
  --gold:#D19D01;
  --gold-soft:rgba(209,157,1,.3);
  --muted:#6E675C;
  --rule:rgba(0,0,0,.14);
  --hair:rgba(0,0,0,.07);
  --display:"Instrument Serif",Georgia,serif;
  --sans:"Archivo",-apple-system,"Segoe UI",sans-serif;
  --gutter:clamp(1.25rem,5vw,4rem);
  --ease:cubic-bezier(.16,.84,.44,1);
  --dock-bg:rgba(251,247,236,.85);
  --dock-rule:var(--rule);
  --dock-ink:var(--ink);
  --dock-muted:var(--muted);
  --dock-accent:var(--gold);
  --dock-active-bg:var(--ink);
  --dock-active-ink:var(--ground);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--sans);font-size:1rem;line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.skip{position:absolute;left:-9999px;background:var(--ink);color:var(--ground);padding:.75rem 1rem;z-index:120}
.skip:focus{left:0;top:0}

/* ============ motion ============ */
[data-reveal]{
  opacity:0;transform:translateY(22px);
  transition:opacity 1s var(--ease),transform 1s var(--ease);
  transition-delay:calc(var(--i,0) * 100ms);
}
[data-reveal].is-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  [data-reveal]{opacity:1!important;transform:none!important;transition:none!important}
  *{animation:none!important}
}
.progress{position:fixed;top:0;left:0;height:2px;width:100%;z-index:110;background:var(--gold);
  transform:scaleX(0);transform-origin:0 50%;transition:transform .12s linear}

/* ============ navigation: shared dock ============ */


/* ============ grid ============ */
.bay{
  padding:clamp(4.5rem,10vw,8rem) var(--gutter);
  display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(1.5rem,3vw,2.5rem);
  align-items:start;
}
.bay + .bay{border-top:1px solid var(--hair)}
@media (max-width:820px){.bay{grid-template-columns:1fr}}
.kicker{font-family:var(--display);font-style:italic;font-size:1.0625rem;color:var(--gold);margin:0 0 .4rem}
.head{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5vw,3.25rem);
  line-height:1.05;letter-spacing:-.01em;margin:0}

/* ============ hero ============ */
.hero{
  min-height:100svh;padding:clamp(5rem,10vw,7rem) var(--gutter) clamp(3rem,7vw,5rem);
  display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(1.5rem,3vw,2.5rem);
  align-content:center;position:relative;
}
.hero__type{grid-column:1 / 10;position:relative;z-index:2}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,9.5vw,7.5rem);
  line-height:.92;letter-spacing:-.025em;margin:0}
.hero h1 span{display:block;overflow:hidden}
.hero h1 i{display:block;font-style:normal;transform:translateY(105%);
  transition:transform 1.1s var(--ease)}
.is-loaded .hero h1 i{transform:none}
.is-loaded .hero h1 span:nth-child(1) i{transition-delay:.25s}
.is-loaded .hero h1 span:nth-child(2) i{transition-delay:.38s}
.is-loaded .hero h1 span:nth-child(3) i{transition-delay:.51s}
.hero h1 em{font-style:italic;color:var(--gold);font-size:.42em;line-height:1.5;display:block}
.hero__meta{
  display:flex;flex-wrap:wrap;gap:.4rem 2rem;margin:2.5rem 0 0;padding-top:1.25rem;
  font-size:.8125rem;letter-spacing:.12em;text-transform:uppercase;position:relative;
  opacity:0;transform:translateY(12px);transition:opacity .9s .8s,transform .9s .8s;
}
.is-loaded .hero__meta{opacity:1;transform:none}
.hero__meta::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--ink);
  transform:scaleX(0);transform-origin:0 50%;transition:transform 1.1s var(--ease) .7s}
.is-loaded .hero__meta::before{transform:none}
.hero__meta span:last-child{color:var(--muted)}
@media (max-width:820px){
  .hero__type{grid-column:1 / -1}
}

/* SCENE — photography as background layers (see PHOTOS in the script) */
.scene{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.scene__img{position:absolute;inset:-12%;transition:opacity 1.3s var(--ease);background-size:cover;background-position:center;
  filter:saturate(.9) contrast(1.02);will-change:transform;transform:scale(1.05)}
.scene__veil{position:absolute;inset:0}
.footer .scene__img{inset:-6%}
.scene-host{position:relative;isolation:isolate}
.scene-host > *:not(.scene){position:relative;z-index:1}
.hero .scene__veil{background:radial-gradient(115% 80% at 65% 10%, rgba(251,247,236,.2) 0%, rgba(251,247,236,.55) 55%, var(--ground) 100%)}
.hero .scene--empty .scene__veil{background:radial-gradient(115% 80% at 65% 10%, var(--paper) 0%, var(--ground) 62%)}
#story .scene__veil{background:linear-gradient(to bottom,var(--ground) 0%,rgba(251,247,236,.66) 20%,rgba(251,247,236,.66) 80%,var(--ground) 100%)}
#story .scene--empty .scene__veil{background:none}
#day .scene__veil{background:linear-gradient(to bottom,var(--ground) 0%,rgba(251,247,236,.6) 22%,rgba(251,247,236,.6) 74%,var(--ground) 100%)}
#day .scene--empty .scene__veil{background:var(--paper);opacity:.5}
.footer .scene__veil{background:linear-gradient(to bottom,rgba(241,233,216,.45),var(--paper))}
.footer .scene--empty .scene__veil{background:none}

/* ============ story ============ */
.story__head{grid-column:1 / 5;position:sticky;top:clamp(5rem,12vh,8rem)}
.story__body{grid-column:6 / 12}
@media (max-width:820px){
  .story__head{grid-column:1 / -1;position:static}
  .story__body{grid-column:1 / -1}
}

/* chapter markers in the sticky head — a live index of the story */
.marks{list-style:none;margin:1.75rem 0 0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.marks li{display:flex;align-items:center;gap:.85rem;font-size:.8125rem;line-height:1.35;
  color:var(--muted);transition:color .45s var(--ease)}
.marks i{flex:none;display:block;width:1.5rem;height:1px;background:var(--rule);
  transition:width .5s var(--ease),background .5s var(--ease)}
.marks li[aria-current="true"]{color:var(--ink)}
.marks li[aria-current="true"] i{width:2.75rem;background:var(--gold)}
@media (max-width:820px){
  .marks{flex-direction:row;gap:.5rem;margin-top:1.5rem}
  .marks span{display:none}
  .marks li{flex:1}
  .marks i{width:100%;height:2px}
  .marks li[aria-current="true"] i{width:100%;background:var(--gold)}
}

/* chapters: the one nearest the middle of the screen holds focus */
.chapter{position:relative;padding-left:clamp(1rem,3vw,1.5rem);
  transition:opacity .7s var(--ease)}
.chapter::before{content:"";position:absolute;left:0;top:.35rem;bottom:.35rem;width:2px;
  border-radius:2px;background:var(--gold);transform:scaleY(0);transform-origin:50% 0;
  transition:transform .8s var(--ease)}
.chapter.is-focus::before{transform:scaleY(1)}
.chapter + .chapter{margin-top:clamp(2.75rem,8vh,4.5rem)}
.is-focusable .chapter{opacity:.3}
.is-focusable .chapter.is-focus{opacity:1}
.chapter h3{font-family:var(--display);font-size:clamp(1.5rem,4.6vw,1.875rem);font-weight:400;
  margin:0 0 .1rem;line-height:1.18}
.chapter time{display:block;font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold);margin-bottom:.9rem}
.chapter p{margin:0;max-width:36rem;font-size:clamp(1rem,3.4vw,1.0625rem);line-height:1.75}
.traits{grid-column:6 / 12;margin-top:2.75rem;padding-top:1.75rem;border-top:1px solid var(--ink);
  display:flex;flex-wrap:wrap;gap:1.5rem 3.5rem}
.traits div{max-width:16rem}
.traits dt{font-family:var(--display);font-style:italic;color:var(--gold);font-size:1.375rem}
.traits dd{margin:0;font-size:.9375rem}
@media (max-width:820px){.traits{grid-column:1 / -1}}

/* ============ THE DAY — sticky aside, separated stops ============ */
.day{padding-inline:var(--gutter);padding-block:clamp(4.5rem,10vw,8rem);border-top:1px solid var(--hair)}
.day__grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(1.5rem,3vw,2.5rem)}
.day__aside{grid-column:1 / 4;position:sticky;top:clamp(5rem,14vh,9rem);align-self:start}
.day__stops{grid-column:5 / 13;display:flex;flex-direction:column;gap:clamp(1.25rem,3vw,2rem)}
@media (max-width:900px){
  .day__aside{grid-column:1 / -1;position:static;margin-bottom:2.5rem}
  .day__stops{grid-column:1 / -1}
}
.countdown{margin:1.5rem 0 0;font-size:.8125rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.countdown b{display:block;font-family:var(--display);font-size:3rem;line-height:1;
  letter-spacing:-.02em;color:var(--ink);text-transform:none;font-weight:400;margin-bottom:.3rem}
.day__progress{margin-top:2rem;display:flex;flex-direction:column;gap:.6rem}
.day__progress button{
  background:none;border:0;padding:.35rem 0 .35rem .95rem;cursor:pointer;text-align:left;
  font-family:var(--sans);font-size:.8125rem;color:var(--muted);position:relative;
  transition:color .3s,padding-left .3s;
}
.day__progress button::before{content:"";position:absolute;left:0;top:50%;width:1px;height:0;
  background:var(--gold);transform:translateY(-50%);transition:height .35s var(--ease)}
.day__progress button:hover{color:var(--ink)}
.day__progress button[aria-current="true"]{color:var(--ink)}
.day__progress button[aria-current="true"]::before{height:1.1rem}

/* each stop is its own panel — clearly separated, not a merged list */
.stop{
  background:var(--paper);border:1px solid var(--rule);
  display:grid;grid-template-columns:1fr;overflow:hidden;
  transition:border-color .5s var(--ease),transform .5s var(--ease),box-shadow .5s var(--ease);
}
.stop:hover{border-color:var(--gold-soft);transform:translateY(-3px);
  box-shadow:0 20px 44px -30px rgba(0,0,0,.35)}
.stop__band{padding:1.05rem clamp(1.35rem,3.5vw,2.5rem);background:var(--ink);color:var(--ground)}
.stop__clock{font-family:var(--display);font-size:clamp(1.75rem,6vw,2.25rem);line-height:1;margin:0;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.stop__clock small{font-family:var(--sans);font-size:.6875rem;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(251,247,236,.6);margin-left:.65rem}
.stop__body{padding:clamp(1.75rem,4vw,2.75rem)}
.stop h3{font-family:var(--display);font-weight:400;font-size:clamp(1.75rem,4vw,2.375rem);
  margin:0 0 .3rem;line-height:1.1}
.stop__when{font-family:var(--display);font-style:italic;color:var(--muted);margin:0 0 1.75rem;font-size:1.0625rem}
.stop__venue{margin:0 0 .1rem;font-size:1rem;font-weight:500}
.stop__addr{margin:0 0 1.25rem;font-size:.875rem}
.stop__addr a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule);transition:color .3s,border-color .3s}
.stop__addr a:hover{color:var(--gold);border-bottom-color:var(--gold)}
.stop__about{margin:0;font-size:1rem}
.stop__note{margin:1.25rem 0 0;font-size:.875rem;color:var(--muted);padding-left:1rem;border-left:2px solid var(--gold)}
/* the Stefana, demoted to a quiet aside inside the ceremony */
.aside{margin:1.75rem 0 0;padding-top:1.25rem;border-top:1px solid var(--rule)}
.aside h4{font-size:.6875rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  margin:0 0 .5rem;font-weight:500}
.aside p{margin:0;font-size:.9375rem;line-height:1.7;color:var(--muted);max-width:38rem}

@media (max-width:620px){
  .stop__body{padding:1.5rem 1.35rem}
  .attire{padding:1.6rem 1.35rem!important}
  .countdown b{font-size:2.5rem}
  .traits div{max-width:none;flex:1 1 100%}
  .chapter + .chapter{margin-top:2rem;padding-top:2rem}
}
.attire{margin-top:clamp(1.25rem,3vw,2rem);padding:clamp(1.75rem,4vw,2.5rem);
  border:1px solid var(--rule);background:var(--ground)}
.attire h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 0 .45rem}
.attire p{margin:0;max-width:38rem;font-size:.9375rem}

/* ---------- registry ---------- */
.registry__head{grid-column:1 / 5;position:sticky;top:clamp(5rem,12vh,8rem)}
.registry__body{grid-column:6 / 13;max-width:38rem}
@media (max-width:820px){.registry__head{grid-column:1 / -1;position:static}
  .registry__body{grid-column:1 / -1}}
.registry__body > p{margin:0 0 1.75rem;font-size:1.0625rem}
.registry__soon{font-style:italic;color:var(--muted);padding-left:1rem;border-left:2px solid var(--gold)}
.registry__links{display:flex;flex-wrap:wrap;gap:.75rem}
.registry__link{display:inline-block;font-family:var(--display);font-size:1.125rem;
  text-decoration:none;color:var(--ink);border:1px solid var(--rule);padding:.75rem 1.6rem;
  transition:background .35s var(--ease),color .35s,border-color .35s}
.registry__link:hover{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* ---------- gallery: a mosaic, tiles of unequal weight ---------- */
.mosaic{grid-column:1 / -1;display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(.5rem,1.4vw,1rem)}
.shot{position:relative;margin:0;overflow:hidden;background:var(--paper);cursor:pointer;
  grid-column:span 3;aspect-ratio:4/5}
.shot > img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.shot:hover > img{transform:scale(1.06)}
.shot::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.16);opacity:0;
  transition:opacity .45s var(--ease);pointer-events:none}
.shot:hover::after{opacity:1}
.shot:nth-child(6n+1){grid-column:span 4;aspect-ratio:3/2}
.shot:nth-child(6n+2){grid-column:span 2;aspect-ratio:3/4}
.shot:nth-child(6n+3){grid-column:span 2;aspect-ratio:1/1}
.shot:nth-child(6n+4){grid-column:span 4;aspect-ratio:16/9}
.frame__empty{width:100%;height:100%;display:grid;place-content:center;text-align:center;gap:.35rem;
  background:linear-gradient(150deg,#F3EBDA 0%,#E3D6BC 100%);
  font-size:.6875rem;letter-spacing:.2em;text-transform:uppercase;color:#8B7D60}
.frame__empty b{display:block;font-family:var(--display);font-size:1.5rem;
  letter-spacing:.02em;color:var(--gold);text-transform:none}
@media (max-width:640px){
  .mosaic{grid-template-columns:repeat(2,1fr)}
  .shot,.shot:nth-child(6n+2),.shot:nth-child(6n+3),.shot:nth-child(6n+4){
    grid-column:span 1;aspect-ratio:4/5}
  .shot:nth-child(6n+1){grid-column:span 2;aspect-ratio:3/2}
}

/* ============ party: inline square portraits ============ */
.avatar{flex:none;display:block;width:2.75rem;aspect-ratio:1;overflow:hidden;
  background:var(--paper);position:relative;
  transition:filter .45s var(--ease)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar__mark{width:100%;height:100%;display:block;fill:#C3B79C}
.member{display:flex;align-items:center;gap:.9rem}
.member:hover .avatar{filter:saturate(1.1) contrast(1.05)}
.member--honored .avatar{outline:1px solid var(--gold);outline-offset:-1px}

/* ============ party ============ */
.party__head{grid-column:1 / 5;position:sticky;top:clamp(5rem,12vh,8rem)}
.party__cols{grid-column:6 / 13;columns:2;column-gap:2.5rem}
@media (max-width:820px){
  .party__head{grid-column:1 / -1;position:static}
  .party__cols{grid-column:1 / -1}
}
@media (max-width:520px){.party__cols{columns:1}}
.member{break-inside:avoid;padding-block:.75rem;border-bottom:1px solid var(--hair);
  transition:padding-left .35s var(--ease)}
.member:hover{padding-left:.5rem}
.member p{margin:0}
.member__name{font-family:var(--display);font-size:1.25rem;line-height:1.3}
.member__role{font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.member--honored .member__role{color:var(--gold)}

/* ============ faq ============ */
.faq__head{grid-column:1 / 5;position:sticky;top:clamp(5rem,12vh,8rem)}
.faq__list{grid-column:6 / 13}
@media (max-width:820px){
  .faq__head{grid-column:1 / -1;position:static}
  .faq__list{grid-column:1 / -1}
}
.faq__item{border-bottom:1px solid var(--hair)}
.faq__item:first-child{border-top:1px solid var(--ink)}
.faq__q{margin:0;font-family:var(--display);font-weight:400;font-size:1.375rem;line-height:1.3}
.faq__q button{
  all:unset;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  width:100%;cursor:pointer;padding:1.35rem 0;box-sizing:border-box;transition:color .3s;
}
.faq__q button:hover{color:var(--gold)}
.faq__q i{flex:none;width:14px;height:14px;position:relative}
.faq__q i::before,.faq__q i::after{content:"";position:absolute;background:var(--gold);
  left:50%;top:50%;transition:transform .4s var(--ease)}
.faq__q i::before{width:14px;height:1px;transform:translate(-50%,-50%)}
.faq__q i::after{width:1px;height:14px;transform:translate(-50%,-50%)}
.faq__item[data-open="true"] .faq__q i::after{transform:translate(-50%,-50%) rotate(90deg)}
.faq__a{overflow:hidden;max-height:0;transition:max-height .55s var(--ease)}
.faq__a p{margin:0 0 1.4rem;font-size:.9375rem;color:var(--muted);max-width:38rem;padding-right:2rem}

/* ============ footer ============ */
.footer{background:var(--paper);padding:clamp(3.5rem,8vw,6rem) var(--gutter);
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:1.5rem 2rem;align-items:flex-end}
.footer h2{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,3.5vw,2.25rem);line-height:1.25;margin:0}
.footer p{margin:0;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:2.2}
.footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule);text-transform:none;letter-spacing:.03em}
.footer a:hover{color:var(--gold);border-bottom-color:var(--gold)}

.lightbox{position:fixed;inset:0;z-index:200;display:none;place-items:center;
  background:rgba(0,0,0,.92);padding:clamp(1rem,5vw,3rem)}
.lightbox.is-open{display:grid}
.lightbox__stage{margin:0;max-width:min(74rem,92vw);display:flex;flex-direction:column;
  align-items:center;gap:1rem}
.lightbox__stage img{max-width:100%;max-height:78vh;object-fit:contain}
.lightbox__stage figcaption{color:rgba(255,255,255,.72);font-size:.875rem;text-align:center}
.lightbox button{position:absolute;background:none;border:0;cursor:pointer;
  color:rgba(255,255,255,.75);transition:color .3s;line-height:1}
.lightbox button:hover{color:#fff}
.lightbox__close{top:1.25rem;right:1.5rem;font-size:2.25rem}
.lightbox__nav{top:50%;transform:translateY(-50%);font-size:3rem;padding:1rem}
.lightbox__nav--prev{left:.5rem}
.lightbox__nav--next{right:.5rem}
</style>
</head>
<body>
<a class="skip" href="#story">Skip to content</a>
<div class="progress" id="progress"></div>

<nav class="dock" id="dock" aria-label="Sections">
  <div class="dock__scroll">
    <div class="dock__inner">
      <span class="dock__marker" aria-hidden="true"></span>
      <a href="#story"     data-target="story">Story</a>
      <a href="#day"       data-target="day">The day</a>
      <a href="#party"     data-target="party">Party</a>
      <a href="#gallery-sec" data-target="gallery-sec">Photos</a>
      <a href="#registry"  data-target="registry">Registry</a>
      <a href="#questions" data-target="questions">Questions</a>
    </div>
  </div>
  <span class="dock__rail" aria-hidden="true"></span>
</nav>



<div id="top">
  <header class="hero scene-host" data-scene="hero" data-scene-opacity=".72" data-scene-position="center 35%">
    <div class="hero__type">
      <h1 id="names"></h1>
      <div class="hero__meta">
        <span id="heroDate"></span>
        <span id="heroPlace"></span>
      </div>
    </div>
  </header>

  <main>
    <section class="bay scene-host" id="story" aria-labelledby="story-t" data-scene="story" data-scene-opacity=".34">
      <div class="story__head" data-reveal>
        <p class="kicker">Since 2016</p>
        <h2 class="head" id="story-t"></h2>
        <ol class="marks" id="storyMarks"></ol>
      </div>
      <div class="story__body" id="chapters" data-reveal></div>
      <dl class="traits" id="traits" data-reveal></dl>
    </section>

    <section class="day scene-host" id="day" data-scene="day" data-scene-opacity=".26" aria-labelledby="day-t">
      <div class="day__grid">
        <div class="day__aside" data-reveal>
          <p class="kicker" id="dayKicker"></p>
          <h2 class="head" id="day-t">The day</h2>
          <p class="countdown" id="countdown"></p>
          <div class="day__progress" id="dayProgress"></div>
        </div>
        <div class="day__stops">
          <div id="stops"></div>
          <div class="attire" data-reveal>
            <h3>What to wear</h3>
            <p id="attire"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="bay" id="party" aria-labelledby="party-t">
      <div class="party__head" data-reveal>
        <p class="kicker" id="partyCount"></p>
        <h2 class="head" id="party-t">Standing with us</h2>
      </div>
      <div class="party__cols" id="partyList" data-reveal></div>
    </section>

    <section class="bay" id="gallery-sec" aria-labelledby="g-t">
      <div class="story__head" data-reveal>
        <p class="kicker">A few of them</p>
        <h2 class="head" id="g-t">Photographs</h2>
      </div>
      <div class="mosaic" id="gallery" data-reveal></div>
    </section>

    <section class="bay" id="registry" aria-labelledby="r-t">
      <div class="registry__head" data-reveal>
        <p class="kicker">If you would like to</p>
        <h2 class="head" id="r-t">Registry</h2>
      </div>
      <div class="registry__body" id="registry-body" data-reveal></div>
    </section>

    <section class="bay" id="questions" aria-labelledby="q-t">
      <div class="faq__head" data-reveal>
        <p class="kicker">Before you come</p>
        <h2 class="head" id="q-t">Questions</h2>
      </div>
      <div class="faq__list" id="faqList" data-reveal></div>
    </section>
  </main>

  <footer class="footer scene-host" data-scene="footer" data-scene-opacity=".72" data-scene-position="center 75%" data-scene-zoom="0.95">
    <h2 id="fNames" data-reveal></h2>
    <p id="fMeta" data-reveal></p>
  </footer>
</div>

<!-- Client content. Replace this file per couple; nothing else changes. -->
<script src="site-data.js"></script>
<!-- Shared engine. Identical in every concept - edit once, all three follow. -->
<script src="engine.js"></script>

<script>

const $ = id => document.getElementById(id);

/* ---------- render ---------- */
$("names").innerHTML =
  "<span><i>" + esc(W.names[0]) + "</i></span>" +
  "<span><i><em>and</em></i></span>" +
  "<span><i>" + esc(W.names[1]) + "</i></span>";
$("heroDate").textContent = W.date.numeric;
$("heroPlace").textContent = W.locality;

$("story-t").textContent = W.storyHeadline;
$("chapters").innerHTML = W.chapters.map(c => `
  <article class="chapter">
    <h3>${esc(c.title)}</h3>
    <time>${esc(c.date)}${c.location ? " &middot; " + esc(c.location) : ""}</time>
    <p>${esc(c.body)}</p>
  </article>`).join("");
$("storyMarks").innerHTML = W.chapters
  .map(c => "<li><i></i><span>" + esc(c.title) + "</span></li>").join("");

$("traits").innerHTML = W.traits
  .map(t => "<div><dt>" + esc(t.who) + "</dt><dd>" + esc(t.bio) + "</dd></div>").join("");

/* --- the day: separated stops --- */
$("dayKicker").textContent = W.date.medium;
$("stops").innerHTML = W.events.map((e, i) => `
  <article class="stop" id="stop-${esc(e.id)}" data-reveal style="--i:${i};margin-bottom:clamp(1.25rem,3vw,2rem)">
    <div class="stop__band">
      <p class="stop__clock">${esc(e.clock)}</p>
    </div>
    <div class="stop__body">
      <h3>${esc(e.name)}</h3>
      <p class="stop__when">${esc(e.formal)}</p>
      <p class="stop__venue">${esc(e.venue)}</p>
      <p class="stop__addr"><a href="${esc(e.maps)}" target="_blank" rel="noopener">${esc(e.address)}</a></p>
      <p class="stop__about">${esc(e.about)}</p>
      ${e.tradition ? `<div class="aside"><h4>A note on the ceremony</h4><p>${esc(e.tradition)}</p></div>` : ""}
      ${e.note.trim() ? `<p class="stop__note">${esc(e.note.trim())}</p>` : ""}
    </div>
  </article>`).join("");

$("dayProgress").innerHTML = W.events.map(e =>
  `<button type="button" data-goto="stop-${esc(e.id)}">${esc(e.clock)} &nbsp; ${esc(e.name)}</button>`).join("");
$("attire").textContent = W.attire;

$("gallery").innerHTML = galleryItems().map((g, i) =>
  '<figure class="shot" data-shot="' + i + '">' + frame(g) + "</figure>").join("");
$("registry-body").innerHTML = "<p>" + esc(W.registry.intro) + "</p>" + registryHTML();

const left = daysUntil();
$("countdown").innerHTML = left > 0
  ? "<b>" + left + "</b>day" + (left === 1 ? "" : "s") + " to go"
  : (left === 0 ? "<b>Today</b>" : "<b>&mdash;</b>married");

$("partyCount").textContent = W.party.length + " of them";
$("partyList").innerHTML = W.party.map(m => `
  <div class="member${m.honored ? " member--honored" : ""}">
    ${avatar(m)}
    <div>
      <p class="member__name">${esc(m.name)}</p>
      <p class="member__role">${esc(m.role)}</p>
    </div>
  </div>`).join("");

$("faqList").innerHTML = W.faq.map(f => `
  <div class="faq__item" data-open="false">
    <h3 class="faq__q"><button type="button" aria-expanded="false">${esc(f.q)}<i></i></button></h3>
    <div class="faq__a"><p>${esc(f.a)}</p></div>
  </div>`).join("");

$("fNames").innerHTML = esc(W.legalNames[0]) + "<br>" + esc(W.legalNames[1]);
$("fMeta").innerHTML = esc(W.date.medium) + "<br>" + esc(W.locality);

/* ---------- behaviour ---------- */

/* FAQ accordion — max-height animated off real content height */
const setPanel = (item, open) => {
  const panel = item.querySelector(".faq__a");
  const btn = item.querySelector("button");
  item.dataset.open = String(open);
  btn.setAttribute("aria-expanded", String(open));
  panel.style.maxHeight = open ? panel.scrollHeight + "px" : "0px";
};
document.querySelectorAll(".faq__item").forEach(item => {
  setPanel(item, false);
  item.querySelector("button").addEventListener("click", () => {
    setPanel(item, item.dataset.open !== "true");
  });
});
addEventListener("resize", () => {
  document.querySelectorAll('.faq__item[data-open="true"]').forEach(i => setPanel(i, true));
});

/* Jump list beside the stops, with its own scrollspy */
const jumpBtns = [...document.querySelectorAll("#dayProgress button")];
jumpBtns.forEach(b => b.addEventListener("click", () => {
  const el = document.getElementById(b.dataset.goto);
  if (el) el.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "center" });
}));
if ("IntersectionObserver" in window) {
  const stopSpy = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      jumpBtns.forEach(b => b.removeAttribute("aria-current"));
      const b = jumpBtns.find(x => x.dataset.goto === e.target.id);
      if (b) b.setAttribute("aria-current", "true");
    });
  }, { rootMargin: "-40% 0px -45% 0px" });
  W.events.forEach(e => {
    const el = document.getElementById("stop-" + e.id);
    if (el) stopSpy.observe(el);
  });
}

/* Chapter focus — whichever chapter sits nearest the middle of the screen
   comes forward and the rest recede. The marks in the head track it. */
function initStoryFocus() {
  const wrap = $("chapters");
  const chapters = [...wrap.querySelectorAll(".chapter")];
  const marks = [...$("storyMarks").querySelectorAll("li")];
  if (!chapters.length) return;

  if (REDUCED || !("IntersectionObserver" in window)) {
    chapters.forEach(c => c.classList.add("is-focus"));
    if (marks[0]) marks[0].setAttribute("aria-current", "true");
    return;
  }
  wrap.classList.add("is-focusable");

  const focus = i => {
    chapters.forEach((c, n) => c.classList.toggle("is-focus", n === i));
    marks.forEach((m, n) =>
      n === i ? m.setAttribute("aria-current", "true") : m.removeAttribute("aria-current"));
  };
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) focus(chapters.indexOf(e.target)); });
  }, { rootMargin: "-45% 0px -45% 0px" });
  chapters.forEach(c => io.observe(c));
  focus(0);
}

paintScenes();
initStoryBackdrop();
initStoryFocus();
initMotion();
initDock(["story","day","party","gallery-sec","registry","questions"]);
initLightbox($("gallery"));
requestAnimationFrame(() => document.body.classList.add("is-loaded"));
</script>
</body>
</html>
